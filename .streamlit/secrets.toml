# Copie este arquivo para .streamlit/secrets.toml somente quando quiser ativar o
# ranking. Nunca publique o arquivo secrets.toml no GitHub.
#
# Com apenas a URL, o app consegue ler uma planilha pública (primeira aba).
# Para gravar no ranking, preencha também os campos da service account abaixo.

[connections.gsheets]
spreadsheet = "https://docs.google.com/spreadsheets/d/1VV37iAj88qqJiQnxXfD5Y0u1wGzE0NkKLlmniRemvoU/edit#gid=0"

# Para leitura e gravação, use o nome da planilha e preencha os dados da
# service account criada no Google Cloud:
#
# spreadsheet = "Game Contábil PRO"
# worksheet = "Ranking"
# type = "service_account"
# project_id = "seu-projeto"
# private_key_id = "seu-private-key-id"
# private_key = "-----BEGIN PRIVATE KEY-----\nSUA_CHAVE\n-----END PRIVATE KEY-----\n"
# client_email = "sua-conta-de-servico@seu-projeto.iam.gserviceaccount.com"
# client_id = "seu-client-id"
# auth_uri = "https://accounts.google.com/o/oauth2/auth"
# token_uri = "https://oauth2.googleapis.com/token"
# auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
# client_x509_cert_url = "URL_FORNECIDA_PELO_GOOGLE"
